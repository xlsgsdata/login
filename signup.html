<html>
  <head>
    <title>SignUp</title>
    <base target="_top">
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
  <div id="container">
  
	<div class="login-page">
      <div class="form">
        <div class="login">
          <div class="login-header">
            <h3>SIGNUP</h3>
            <p>Please fill in the registration form</p>
          </div>
        </div>
        <div class="login-form">
			<form id="signupForm">
				<input type="text" required id="name" placeholder="Name" autocomplete="name">			
				<input type="email" required id="email" placeholder="Email Address" autocomplete="email">
				<input type="password" required minlength="8" id="password" placeholder="Password" autocomplete="new-password">
				<!-- pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$"
					title="Minimum 8 characters, including uppercase, lowercase, number and special character"  -->
				
				<div class="output">
					<div id="loader"></div>
					<div id="logfail"></div>
				</div>				
				
				<button type="submit">Sign Up</button>
				
				<p class="message">
					<a href='login.html'>Log In</a>OR 
					<a href='recover.html'>Forgot password?</a>
				</p>
			</form>
		</div>	
	</div>		
  </div>
  <script src="script.js" type="text/javascript"></script>
  <script src="signup.js" type="text/javascript"></script>
  </body>
</html>
