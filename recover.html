<html>
  <head>
    <title>Recovery</title>
    <base target="_top">
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
  <div id="container">
  
	<div class="login-page">
      <div class="form">
        <div class="login">
          <div class="login-header">
            <h3>PASSWORD RECOVERY</h3>
            <p>Please enter the registered email address</p>
          </div>
        </div>
        <div class="login-form">
			<form id="recoveryForm">
				<input type="email" required id="email" placeholder="Email Address" autocomplete="email">
				
				<div class="output">
					<div id="loader"></div>
					<div id="logfail"></div>
				</div>				
				
				<button type="submit">Recover Password</button>
				
				<p class="message">
					<a href='login.html'>Log In</a>OR
					<a class="reg" href='signup.html'>Register account</a>
				</p>
			</form>
		</div>	
	</div>		
  </div>
  <script src="script.js" type="text/javascript"></script>
  <script src="recover.js" type="text/javascript"></script>
  </body>
</html>
