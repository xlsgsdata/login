<html>
  <head>
    <title>LogIn</title>
    <base target="_top">
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
  <div id="container">
  
	<div class="login-page">
      <div class="form">
        <div class="login">
          <div class="login-header">
            <h3>LOGIN</h3>
            <p>Please enter your credentials to login</p>
          </div>
        </div>
        <div class="login-form">
			<form id="loginForm">
				<input type="email" required id="email" placeholder="Email Address" autocomplete="email">
				<input type="password" required id="password" placeholder="Password" autocomplete="current-password">
				
				<div class="output">
					<div id="loader"></div>
					<div id="logfail"></div>
				</div>				
				
				<button type="submit">Log In</button>
				
				<p class="message">
					<a href='recover.html'>Forgot password?</a>OR
					<a class="reg" href='signup.html'>Register account</a>
				</p>
			</form>
		</div>	
	</div>		
  </div>
  <script src="script.js" type="text/javascript"></script>
  <script src="login.js" type="text/javascript"></script>
  </body>
</html>
