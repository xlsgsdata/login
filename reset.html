<html>
  <head>
    <title>Reset</title>
    <base target="_top">
	<link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
  <div id="container">
  
	<div class="login-page">
      <div class="form">
        <div class="login">
          <div class="login-header">
            <h3>RESET PASSWORD</h3>
            <p>Please enter and confirm the new password</p>
          </div>
        </div>
        <div class="login-form">
			<form id="resetForm">
				<input type="password" required minlength="8" id="password" placeholder="New Password" autocomplete="new-password">
				<input type="password" required minlength="8" id="repassword" placeholder="Confirm Password" autocomplete="new-password">
				
				<div class="output">
					<div id="loader"></div>
					<div id="logfail"></div>
				</div>				
				
				<button type="submit">Reset Password</button>
				
				<p class="message">
					<a href='login.html'>Log In</a>OR
					<a class="reg" href='signup.html'>Register account</a>
				</p>
			</form>
		</div>	
	</div>		
  </div>
  <script src="script.js" type="text/javascript"></script>
  <script src="reset.js" type="text/javascript"></script>
  </body>
</html>
